name: Fast Full Download babft.com

on:
  workflow_dispatch:

jobs:
  fast-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download .build files
        run: |
          mkdir -p builds
          # Скачивание всех .build файлов через wget
          wget -r -l 5 -A "*.build" -P builds/ https://babft.com/ || true

      - name: Commit and Push files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add downloaded .build files" || exit 0
          git push
