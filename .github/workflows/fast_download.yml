name: Fast Full Download babft.com

on:
  workflow_dispatch:

jobs:
  fast-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download .build files by ID range
        run: |
          mkdir -p builds
          cd builds
          # Скачиваем файлы по номерам от 1 до 1000 (настройте диапазон)
          for id in $(seq 1 500); do
            curl -s -O "https://babft.com/builds/${id}.build" || true
          done

      - name: Commit and Push files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Add downloaded .build files" || exit 0
          git push
